    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (() => {
        const duration = 4;
        const textColor = "#171917";
        const accentColor = "#245cf0";
        const sequence = [
          { t: 0, text: "", segment: "main" },
          { t: 0.2, text: "R", segment: "main" },
          { t: 0.27, text: "Re", segment: "main" },
          { t: 0.34, text: "Rea", segment: "main" },
          { t: 0.41, text: "Read", segment: "main" },
          { t: 0.49, text: "Ready", segment: "main" },
          { t: 0.64, text: "Ready ", segment: "main" },
          { t: 0.72, text: "Ready t", segment: "main" },
          { t: 0.78, text: "Ready to", segment: "main" },
          { t: 0.92, text: "Ready to ", segment: "main" },
          { t: 1.0, text: "Ready to s", segment: "main" },
          { t: 1.06, text: "Ready to sh", segment: "main" },
          { t: 1.12, text: "Ready to shi", segment: "main" },
          { t: 1.18, text: "Ready to ship", segment: "main" },
          { t: 1.28, text: "Ready to ship?", segment: "accent" },
        ];
        const outcomeSequence = [
          { t: 0, text: "" },
          { t: 1.46, text: "Every" },
          { t: 1.66, text: "Every launch" },
          { t: 1.88, text: "Every launch deserves" },
          { t: 2.1, text: "Every launch deserves\nmore" },
          { t: 2.32, text: "Every launch deserves\nmore than" },
          { t: 2.48, text: "Every launch deserves\nmore than a" },
          { t: 2.58, text: "Every launch deserves\nmore than a blank" },
          { t: 2.72, text: "Every launch deserves\nmore than a blank page." },
        ];
        const entryAt = (time) => {
          for (let i = sequence.length - 1; i >= 0; i -= 1) {
            if (time >= sequence[i].t) return sequence[i];
          }
          return sequence[0];
        };
        const outcomeAt = (time) => {
          for (let i = outcomeSequence.length - 1; i >= 0; i -= 1) {
            if (time >= outcomeSequence[i].t) return outcomeSequence[i];
          }
          return outcomeSequence[0];
        };

        const typed = document.querySelector('[class~="01-beyond-blank-page-typed"]');
        const outcomeTyped = document.querySelector('[class~="01-beyond-blank-page-outcome-typed"]');
        const caret = document.querySelector('[class~="01-beyond-blank-page-caret"]');
        const rule = document.getElementById("01-beyond-blank-page-rule");
        const ruleLength = rule.getTotalLength();
        rule.style.strokeDasharray = `${ruleLength}`;
        rule.style.strokeDashoffset = `${ruleLength}`;

        const tl = gsap.timeline({ paused: true });
        const playhead = { t: 0 };
        tl.to(
          playhead,
          {
            t: duration,
            duration,
            ease: "none",
            onUpdate: () => {
              const entry = entryAt(playhead.t);
              typed.textContent = entry.text;
              outcomeTyped.textContent = outcomeAt(playhead.t).text;
              caret.style.backgroundColor = entry.segment === "accent" ? accentColor : textColor;
              const blink = Math.sin((playhead.t / duration) * Math.PI * 12 - Math.PI / 2) > 0;
              caret.style.opacity = playhead.t >= 2.8 ? "0" : blink ? "1" : "0";
            },
          },
          0,
        );
        tl.to(
          rule,
          { strokeDashoffset: 0, duration: 0.78, ease: "power2.out" },
          1.3,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["01-beyond-blank-page"] = tl;
        tl.seek(0);
      })();
    </script>
