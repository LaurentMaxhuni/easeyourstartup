    <script>
      (() => {
        const root = document.currentScript.parentElement;
        const W = 1920;
        const H = 1080;
        const centerOffset = (selector) => {
          const rect = root.querySelector(selector).getBoundingClientRect();
          return {
            x: rect.left + rect.width / 2 - W / 2,
            y: rect.top + rect.height / 2 - H / 2,
            width: rect.width,
            height: rect.height,
          };
        };
        const maxScale = ({ width, height }) => Math.min((0.88 * W) / width, (0.88 * H) / height);
        const cameraPose = (offset, scale) => ({
          scale,
          x: -offset.x * scale,
          y: -offset.y * scale,
        });

        const reviewOffset = centerOffset("#review-target");
        const previewOffset = centerOffset("#preview-target");
        const outputsOffset = centerOffset("#outputs-target");
        const reviewScale = Math.min(1.42, maxScale(reviewOffset));
        const viewportScale = Math.min(1.48, maxScale(outputsOffset));
        const reviewCounter = { x: -reviewOffset.x, y: -reviewOffset.y };
        const previewPose = cameraPose(previewOffset, viewportScale);
        const outputsPose = cameraPose(outputsOffset, viewportScale);

        const cam = { scale: 1, x: 0, y: 0 };
        const world = root.querySelector("#world");
        const applyCamera = () => {
          world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
        };
        applyCamera();

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#screen-panel-content",
          { opacity: 0, scale: 0.985 },
          { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" },
          0,
        );
        tl.fromTo(
          "#copy-eyebrow-inner",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
          0.18,
        );
        tl.fromTo(
          "#word-review",
          { opacity: 0, x: 18 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power3.out" },
          0.2,
        );
        tl.fromTo(
          "#word-preview",
          { opacity: 0, x: 18 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power3.out" },
          1.48,
        );
        tl.fromTo(
          "#word-export",
          { opacity: 0, x: 18 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power3.out" },
          2.82,
        );
        tl.fromTo(
          "#preview-action-inner",
          { opacity: 0, x: 20 },
          { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" },
          1.48,
        );
        tl.fromTo(
          "#campaign-action-inner",
          { opacity: 0, x: 20 },
          { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" },
          2.82,
        );

        // Scene 1: nested scale + counter-translate locks the existing review row at center.
        tl.fromTo(
          "#zoom-outer",
          { scale: 1 },
          { scale: reviewScale, duration: 1.02, ease: "power3.inOut" },
          0.22,
        );
        tl.fromTo(
          "#zoom-inner",
          { x: 0, y: 0 },
          { x: reviewCounter.x, y: reviewCounter.y, duration: 1.02, ease: "power3.inOut" },
          0.22,
        );
        tl.to("#zoom-outer", { scale: 1, duration: 0.24, ease: "power3.inOut" }, 1.44);
        tl.to("#zoom-inner", { x: 0, y: 0, duration: 0.24, ease: "power3.inOut" }, 1.44);

        // Scene 2: the single world camera lands on the real Preview PNG control.
        tl.to(
          cam,
          {
            ...previewPose,
            duration: 1.08,
            ease: "power3.inOut",
            onUpdate: applyCamera,
          },
          1.68,
        );
        // Scene 3: move across to keep both genuine output controls together in view.
        tl.to(
          cam,
          {
            ...outputsPose,
            duration: 0.68,
            ease: "power3.inOut",
            onUpdate: applyCamera,
          },
          2.9,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["06-review-and-export"] = tl;
