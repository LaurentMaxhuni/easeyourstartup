    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-beyond-blank-page", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-turn-every-ship-into-a-campaign", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-turn-every-ship-into-a-campaign", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 8);
        tl.fromTo("#el-03-start-with-the-source", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 8);
        tl.to("#el-03-start-with-the-source", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.fromTo("#el-04-meet-founders-where-they-publish", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.to("#el-04-meet-founders-where-they-publish", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-05-keep-the-product-real", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.to("#el-05-keep-the-product-real", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-06-review-and-export", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to("#el-06-review-and-export", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 28);
        tl.fromTo("#el-07-keep-shipping", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 28);
        tl.to({}, { duration: 33 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
